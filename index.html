<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy New Year ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at bottom, #020111, #000);
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    .content {
      z-index: 2;
      padding: 20px;
    }

    h1 {
      font-size: 3rem;
      animation: glow 2s infinite alternate;
    }

    h2 {
      margin-top: 15px;
      font-size: 2rem;
      color: pink;
      opacity: 0;
      animation: slideUp 2s forwards 2s;
    }

    p {
      margin-top: 12px;
      font-size: 1.2rem;
      opacity: 0;
      animation: fadeIn 2s forwards 4s;
    }

    .music-btn {
      margin-top: 25px;
      padding: 12px 22px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(45deg, pink, red);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      animation: fadeIn 2s forwards 5s;
      opacity: 0;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px gold, 0 0 20px orange;
      }
      to {
        text-shadow: 0 0 20px pink, 0 0 40px red;
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 📱 MOBILE SCREENS */
    @media (max-width: 600px) {
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    }

      h2 {
        font-size: 1.4rem;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
      }

      p {
        font-size: 1rem;
        font-family: 'Courier New', Courier, monospace;
      }

      
    }
  </style>
</head>
<body>

  <div class="content">
    <h1>🎆 Happy New Year, Babe 🎆</h1>
    <p>Here’s to another year of love, laughter, and us ✨</p>
    <h2 id="typing-text"></h2>
    
  </div>

  <canvas id="fireworks"></canvas>

  <script>
  const text = "I love you so much, Elizabeth💖";
  let index = 0;
  const speed = 300; // typing speed (ms)

  function typeText() {
    if (index < text.length) {
      document.getElementById("typing-text").innerHTML += text.charAt(index);
      index++;
      setTimeout(typeText, speed);
    }
  }

  // Start typing after page loads
  window.onload = () => {
    typeText();
  };
    function playMusic() {
      const music = document.getElementById("bgMusic");
      music.play();
      document.querySelector(".music-btn").style.display = "none";
    }

    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    class Firework {
      constructor() {
        this.x = random(0, canvas.width);
        this.y = canvas.height;
        this.targetY = random(50, canvas.height / 2);
        this.color = `hsl(${random(0, 360)}, 100%, 60%)`;
        this.speed = random(3, 6);
        this.exploded = false;
        this.particles = [];
      }

      update() {
        if (!this.exploded) {
          this.y -= this.speed;
          if (this.y <= this.targetY) {
            this.exploded = true;
            for (let i = 0; i < 35; i++) {
              this.particles.push(new Particle(this.x, this.y, this.color));
            }
          }
        }
      }

      draw() {
        if (!this.exploded) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
        }
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = random(1, 3);
        this.vx = random(-3, 3);
        this.vy = random(-3, 3);
        this.life = 100;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }

    let fireworks = [];

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (Math.random() < 0.05) {
        fireworks.push(new Firework());
      }

      fireworks.forEach((fw, i) => {
        fw.update();
        fw.draw();

        if (fw.exploded) {
          fw.particles.forEach((p, pi) => {
            p.update();
            p.draw();
            if (p.life <= 0) fw.particles.splice(pi, 1);
          });
          if (fw.particles.length === 0) fireworks.splice(i, 1);
        }
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
